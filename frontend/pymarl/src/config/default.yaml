# --- Defaults ---

# --- pymarl options ---
runner: "episode" # Runs 1 env for an episode
mac: "basic_mac" # Basic controller
env: "unity_tcp" # Environment name
env_args:
  host: "127.0.0.1" # Unity TCP server host
  port: 5000 # Unity TCP server port
  map_id: "xiongan_30" # Formal 30-intersection Unity map loaded on every reset
  timeout: 60.0 # Unity TCP socket timeout in seconds
  action_dims: [5, 2] # Intersection agent heads: vehicle next-hop and binary signal switch
  simulate_packet_loss: False # Enable explicitly for distance-aware wireless-delay evaluation
  max_packet_loss_probability: 0.2 # Upper bound p_max; use 0.0/0.05/.../0.30 for wireless-robustness tests
  trajectory_entropy_enabled: False # If true, add computed TEE bonus to learner reward; diagnostics are always logged
  trajectory_entropy_scale: 5 # Scaling factor for gated trajectory-entropy reward bonus
  trajectory_embedding_points: 16 # Number of points per trajectory embedding
  trajectory_history_size: 200 # Per-vehicle history size for trajectory embeddings
  trajectory_knn_k: 1 # K in KNN entropy
  trajectory_map_extent: 1000.0 # Map width/height used for coordinate normalization
  trajectory_noop_decision: 0 # Decision value treated as NoOp (not counted)
  trajectory_entropy_step_clip_min: 0.0 # Clip lower bound for per-step entropy reward
  trajectory_entropy_step_clip_max: 0.08 # Clip upper bound for per-step entropy reward
  trajectory_entropy_progress_threshold: 0.20 # Required target-distance progress ratio for full entropy reward
  trajectory_entropy_uturn_ratio_max: 0.25 # Suppress entropy reward when UTurn ratio is above this value
  trajectory_entropy_repeat_cell_ratio_max: 0.35 # Suppress entropy reward when local repeated-cell ratio is above this value
  trajectory_road_repeat_ratio_max: 0.35 # Suppress TEE when too many road nodes repeat within the current trajectory
  trajectory_entropy_loop_cell_size: 40.0 # World-unit grid size used to detect local looping
  trajectory_entropy_activation_test_completion_rate: 0.0 # Auto-enable TEE reward after fixed-test completion rate reaches this value
  trajectory_heatmap_bins: 20 # Grid bins per axis for scalar trajectory coverage diagnostics
  trajectory_record_vehicle_id: 0 # Vehicle whose 16-point trajectory embedding is logged for 2D projection
  train_seed_repeat: 1 # use when not in window model
  reward_stage: 3 # 1=vehicle route reward, 2=signal reward, 3=sum of both
  randomize_target_points: True # If true, Unity moves existing target points each reset using env_args.seed + episode index
  train_seed_base: 200000 # Base seed for training resets when randomize_target_points is enabled
  train_seed_count: 100000 # Number of training seeds in the fixed training set
  train_seed_window_size: 5 # Number of seeds per rolling training window
  train_seed_window_cycles: 3 # Number of round-robin passes through each window before moving on
  test_seed_base: 900000 # Base seed for fixed evaluation resets
  test_seed_count: 100000 # Number of fixed evaluation seeds cycled during each test phase
batch_size_run: 1 # Number of environments to run in parallel
test_nepisode: 10 # Number of episodes to test for
test_interval: 5000 # Test after {} timesteps have passed
test_greedy: True # Use greedy evaluation (if False, will set epsilon floor to 0
log_interval: 5000 # Log summary of stats after every {} timesteps
runner_log_interval: 5000 # Log runner stats (not test stats) every {} timesteps
learner_log_interval: 5000 # Log training stats every {} timesteps
t_max: 50000 # Stop running after this many timesteps
use_cuda: True # Use gpu by default unless it isn't available
buffer_cpu_only: True # If true we won't keep all of the replay buffer in vram

# --- Logging options ---
use_tensorboard: False # Log results to tensorboard
save_model: True # Save the models to disk
save_model_interval: 5000 # Save models after this many timesteps
checkpoint_path: "" # Load a checkpoint from this path
evaluate: False # Evaluate model for test_nepisode episodes and quit (no training)
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
save_replay: False # Saving the replay of the model loaded from checkpoint_path
local_results_path: "results" # Path for local results

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 256 # Size of the replay buffer; balanced for two parallel Unity/PyMARL runs on 32GB RAM
lr: 0.0005 # Fixed learning rate for agents
critic_lr: 0.0005 # Learning rate for critics
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm
expert_action_supervised_enabled: False # Add behavior-cloning loss from Unity expert vehicle actions
expert_action_supervised_coef: 0.2 # Weight of expert-action cross-entropy loss

# --- Agent parameters ---
agent: "rnn" # Default rnn agent
rnn_hidden_dim: 64 # Size of hidden state for default rnn agent
obs_agent_id: False # Shared intersection policy uses topology/local observations instead of memorising intersection IDs
obs_last_action: False # Current signal phase and graph-route features already describe the decision state

# --- Experiment running params ---
seed: 489098558
repeat_id: 1
label: "default_label"
